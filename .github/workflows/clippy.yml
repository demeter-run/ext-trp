name: Clippy

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/clippy.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/check-trust-floor.sh"
      - "operator/**"
      - "proxy/**"
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/clippy.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/check-trust-floor.sh"
      - "operator/**"
      - "proxy/**"

jobs:
  lint:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Check trust floor
        run: sh scripts/check-trust-floor.sh Cargo.lock

      - name: Clippy check lints
        run: cargo clippy -- -D warnings
